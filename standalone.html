          <td class="ctr">${idx + 1}</td>
          <td><b>${esc(s.id)}</b></td>
          <td><b>${esc(s.name)}</b></td>
          <td>${esc(s.contact || "—")}</td>
          <td>${esc(s.mobile || "—")}</td>
          <td>${esc(s.addr || "—")}</td>
          <td class="rt">${bdt(pur)}</td>
          <td class="rt">${bdt(paid)}</td>
          <td class="rt" style="font-weight:700;color:${due > 0 ? '#dc2626' : 'inherit'}">${bdt(due)}</td>
        </tr>`;
      }).join("");

      const iRow = (k, v) => `<div class="if-row"><span>${k}</span><b>${v}</b></div>`;

      openPrint("Supplier Directory " + today(), `
        <div class="inv-frame">
          <div class="if-head">
            ${companyLogoHtml()}
            <div class="if-co">
              <div class="if-name">${esc(db.settings.name)}</div>
              <div class="if-tag">${esc(db.settings.tagline || "Healthy Animals • Safe Food • Better Tomorrow")}</div>
              <div class="if-meta">${esc(db.settings.address)} &nbsp;&middot;&nbsp; Mobile: ${esc(db.settings.mobile)} &nbsp;&middot;&nbsp; ${esc(db.settings.email)}</div>
            </div>
          </div>
          <div class="if-title">SUPPLIER DIRECTORY &amp; PAYABLE BALANCE REPORT</div>
          <div class="if-info">
            <div class="if-col">
              ${iRow("Document:", "Vendor Directory & Payable Statement")}
              ${iRow("Registered Suppliers:", (db.suppliers || []).length + " Vendors")}
              ${iRow("Total Purchases:", bdt(totalPur))}
            </div>
            <div class="if-col">
              ${iRow("Statement Date:", today())}
              ${iRow("Total Payments Paid:", bdt(totalPaid))}
              ${iRow("Total Outstanding Payable:", bdt(totalPayable))}
            </div>
          </div>
          <table class="ptable" style="margin-top:8px">
            <colgroup>
              <col style="width:4%">
              <col style="width:9%">
              <col style="width:20%">
              <col style="width:12%">
              <col style="width:11%">
              <col style="width:18%">
              <col style="width:9%">
              <col style="width:8.5%">
              <col style="width:8.5%">
            </colgroup>
            <thead><tr>
              <th>SL</th><th>Code</th><th>Supplier / Company Name</th><th>Contact Person</th><th>Mobile</th><th>Address</th><th>Purchases</th><th>Paid</th><th>Payable</th>
            </tr></thead>
            <tbody>
              ${rows}
              <tr class="grand">
                <td colspan="6" class="sleft">TOTAL SUPPLIER PAYABLE:</td>
                <td class="rt">${bdt(totalPur)}</td>
                <td class="rt">${bdt(totalPaid)}</td>
                <td class="rt" style="color:#dc2626">${bdt(totalPayable)}</td>
              </tr>
              <tr class="inwords-row">
                <td colspan="9" class="inwords-cell">
                  <b>Total Outstanding Payable in Words:</b> ${numToWords(totalPayable)}
                </td>
              </tr>
            </tbody>
          </table>
          ${watermarkHtml()}
          <div class="if-foot" style="margin-top:auto">
            <div class="if-note">
              <b>Accounts Payable:</b> Reconciled as of ${today()}. Payments scheduled as per approved vendor terms.
            </div>
            <div class="psign">
              <div>Accounts Officer<span class="sline"></span></div>
              <div>Procurement Manager<span class="sline"></span></div>
              <div>Finance Controller<span class="sline"></span></div>
            </div>
          </div>
        </div>`, "landscape");
    },

    setSummaryDate(d) { summaryDate = d; render(); },
    setSummaryOfficer(o) { summaryOfficer = o; render(); },
    printDailyInvoiceSummary(offName) { printDailyInvoiceSummarySheet(offName, summaryDate); },
    printDailyValueSummary(offName) { printDailyValueSummarySheet(offName, summaryDate); },
    showDailyInvoiceSummary(d, o) {
      if (d) summaryDate = d;
      if (o) summaryOfficer = o;
      V.go("inv-summary");
    },
    showDailyValueSummary(d, o) {
      if (d) summaryDate = d;
      if (o) summaryOfficer = o;
      V.go("val-summary");
    },
    printPur(id) {
      const rec = db.purchases.find((x) => x.id === id);
      if (!rec) { toast("Purchase invoice not found"); return; }
      const sup = db.suppliers.find((x) => x.id === rec.sid) || {};
      const iRow = (k, v) => `<div class="if-row"><span>${k}</span><b>${v}</b></div>`;
      const purRows = (rec.items || []).map((it, n) => {
        const p = prod(it.pid);
        const amt = it.qty * it.rate;
        return `<tr>
          <td class="ctr">${n + 1}</td>
          <td><b>${esc(p.code || it.code || "")}</b></td>
          <td>${esc(p.name || it.name || "")}</td>
          <td class="ctr">${esc(p.pack || it.pack || "—")}</td>
          <td class="ctr">${esc(it.batch || "—")}</td>
          <td class="ctr"><b>${it.qty}</b></td>
          <td class="rt">${Number(it.rate).toLocaleString("en-IN", { minimumFractionDigits: 2 })}</td>
          <td class="rt"><b>${bdt(amt)}</b></td>
        </tr>`;
      }).join("");

      openPrint("Purchase Invoice " + rec.no, `
        <div class="inv-frame">
          <div class="if-head">
            ${companyLogoHtml()}
            <div class="if-co">
              <div class="if-name">${esc(db.settings.name)}</div>
              <div class="if-tag">${esc(db.settings.tagline || "Healthy Animals • Safe Food • Better Tomorrow")}</div>
              <div class="if-meta">${esc(db.settings.address)} &nbsp;&middot;&nbsp; Mobile: ${esc(db.settings.mobile)} &nbsp;&middot;&nbsp; ${esc(db.settings.email)} &nbsp;&middot;&nbsp; ${esc(db.settings.web || "")}</div>
            </div>
          </div>
          <div class="if-title">PURCHASE INVOICE / GOODS RECEIVE BILL</div>
          <div class="if-info">
            <div class="if-col">
              ${iRow("Supplier Name", esc(sup.name || "—"))}
              ${iRow("Supplier Code", esc(sup.code || "—"))}
              ${iRow("Contact Person", esc(sup.contact || "—"))}
              ${iRow("Mobile", esc(sup.mobile || "—"))}
              ${iRow("Address", esc(sup.addr || "—"))}
            </div>
            <div class="if-col">
              ${iRow("Invoice Number", esc(rec.no))}
              ${iRow("Purchase Date", esc(rec.date))}
              ${iRow("Payment Method", esc(rec.method || "Cash"))}
              ${iRow("Receiving Depot", esc(rec.wh || "Central Warehouse"))}
              ${iRow("Printing Date", today())}
              ${iRow("Received By", esc(me.name))}
            </div>
          </div>
          <table class="ptable">
            <colgroup>
              <col style="width:4%">
              <col style="width:14%">
              <col style="width:28%">
              <col style="width:10%">
              <col style="width:10%">
              <col style="width:8%">
              <col style="width:12%">
              <col style="width:14%">
            </colgroup>
            <thead><tr>
              <th>SL</th><th>Product Code</th><th>Product Name</th><th>Pack Size</th><th>Batch No</th><th>Qty</th><th>Purchase Rate</th><th>Amount</th>
            </tr></thead>
            <tbody>
              ${purRows}
              <tr class="grand">
                <td colspan="5" class="sleft">TOTAL BILL:</td>
                <td class="ctr">${(rec.items || []).reduce((s, it) => s + Number(it.qty || 0), 0)}</td>
                <td></td>
                <td class="rt">${bdt(rec.total)}</td>
              </tr>
              <tr>
                <td colspan="7" class="sleft">Paid Amount:</td>
                <td class="rt">${bdt(rec.paid)}</td>
              </tr>
              <tr>
                <td colspan="7" class="sleft">Remaining Due Payable:</td>
                <td class="rt" style="color:#dc2626;font-weight:700">${bdt(rec.total - rec.paid)}</td>
              </tr>
              <tr class="inwords-row">
                <td colspan="8" class="inwords-cell">
                  <b>Total Bill in Words:</b> ${numToWords(rec.total)}
                </td>
              </tr>
            </tbody>
          </table>
          ${watermarkHtml()}
          <div class="if-foot">
            <div class="if-note">
              <b>Quality &amp; GRN Verification:</b> Goods received and inspected by Central Warehouse. Batch &amp; expiry records entered into FEFO inventory system.
            </div>
            <div class="psign">
              <div>Prepared By (Purchase)<span class="sline"></span></div>
              <div>Store Keeper (Goods Received)<span class="sline"></span></div>
              <div>Quality Control (QC)<span class="sline"></span></div>
              <div>Authorized Signature<span class="sline"></span></div>
            </div>
          </div>
        </div>`);
    }
  };

  function enterApp(u) {
    me = u;
    try { localStorage.setItem("vet360-ui-sess", u.username); } catch (e) {}
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");
    render();
  }
  $("login-form").onsubmit = (e) => {
    e.preventDefault();
    const u = db.users.find((x) => x.username === $("u").value.trim() && x.password === $("p").value && x.active);
    if (!u) { $("err").textContent = "Wrong user or password"; return; }
    audit("Auth", "LOGIN", u.username); save();
    route = "dash";
    enterApp(u);
  };
  $("btn-out").onclick = () => {
    audit("Auth", "LOGOUT", me && me.username); save();
    try { localStorage.removeItem("vet360-ui-sess"); } catch (e) {}
    me = null;
    location.reload();
  };
  try {
    if ($("login-co-name") && db.settings && db.settings.name) {
      $("login-co-name").textContent = db.settings.name;
    }
    const un = localStorage.getItem("vet360-ui-sess");
    const u = (un && db.users.find((x) => x.username === un && x.active)) || db.users.find((x) => x.username === "admin" && x.active);
    if (u) { route = "dash"; enterApp(u); }
  } catch (e) {}

  window.addEventListener("afterprint", () => {
    if (typeof V !== "undefined" && typeof V.closePrint === "function") {
      V.closePrint();
    }
  });

  // Global Real-time Date Input Change & Input Listener
  document.addEventListener("change", (e) => {
    if (e.target && (e.target.type === "date" || (e.target.id && (e.target.id.includes("date") || e.target.id.includes("from") || e.target.id.includes("to"))))) {
      if (typeof V !== "undefined" && typeof V.handleDateChange === "function") {
        V.handleDateChange(e.target);
      }
    }
  });
  document.addEventListener("input", (e) => {
    if (e.target && e.target.type === "date") {
      if (typeof V !== "undefined" && typeof V.handleDateChange === "function") {
        V.handleDateChange(e.target);
      }
    }
  });

  document.addEventListener("paste", (e) => {
    if (route !== "logo" && route !== "branding") return;
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type && item.type.indexOf("image") !== -1) {
        const file = item.getAsFile();
        if (file) {
          V.processLogoFile(file);
          break;
        }
      }
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const t = e.target;
    if (!t) return;
    if (t.tagName === "TEXTAREA") return;
    if (t.tagName === "BUTTON") return;
    if (document.body.classList.contains("printing")) return;
    if ($("login") && !$("login").classList.contains("hidden")) return;
    const open = document.querySelector(".combo-list.on");
    if (open) {
      e.preventDefault();
      e.stopPropagation();
      const item = open.querySelector(".combo-item");
      const combo = open.closest(".combo");
      const inp = combo && combo.querySelector("input");
      if (item) item.click();
      setTimeout(() => focusNextField(inp || t), 0);
      return;
    }
    if (t.id === "cq") { e.preventDefault(); V.custFind(); return; }
    if (t.id === "iq") { e.preventDefault(); V.invFind(); return; }
    if (focusNextField(t)) { e.preventDefault(); return; }
    if ($("mo")) { e.preventDefault(); $("mo").click(); return; }
    if (invForm && $("ilines")) { e.preventDefault(); V.saveInv(); return; }
  });

})();

</script>
</body>
</html>
