    <path id="div-chattogram" data-name="Chattogram" data-sales="98,320"
          d="M 188 126 C 206 130, 228 126, 244 116 C 252 145, 258 185, 254 228 C 248 268, 238 310, 228 348 C 220 348, 214 330, 208 300 C 196 260, 184 220, 172 188 C 178 168, 184 146, 188 126 Z"
