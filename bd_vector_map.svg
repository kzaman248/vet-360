          fill="#8B5CF6" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- 2. Rajshahi Division (Orange #F59E0B) -->
    <path id="div-rajshahi" data-name="Rajshahi" data-sales="76,800"
          d="M 26 50 C 38 62, 58 78, 58 78 C 70 82, 82 85, 96 86 C 98 102, 104 120, 108 138 C 96 148, 78 158, 58 152 C 38 146, 18 130, 14 110 C 12 90, 18 70, 26 50 Z"
          fill="#F59E0B" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>

