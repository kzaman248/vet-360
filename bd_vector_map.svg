    <path id="div-dhaka" data-name="Dhaka" data-sales="1,25,450"
          d="M 96 86 C 114 88, 128 90, 160 88 C 176 96, 182 108, 188 126 C 184 146, 178 168, 172 188 C 152 198, 134 204, 118 198 C 112 180, 108 158, 108 138 C 104 120, 98 102, 96 86 Z"
          fill="#10B981" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- 6. Khulna Division (Crimson Red #EF4444) -->
    <path id="div-khulna" data-name="Khulna" data-sales="54,230"
