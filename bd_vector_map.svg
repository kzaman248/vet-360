  <!-- City Dots & Labels -->
  <g fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">
    <!-- Dhaka Pin -->
    <circle cx="138" cy="142" r="4.5" fill="#ffffff" stroke="#10B981" stroke-width="2"/>
    <text x="138" y="156" fill="#064e3b">DHAKA</text>

    <!-- CTG Pin -->
    <circle cx="216" cy="228" r="4" fill="#ffffff" stroke="#0284C7" stroke-width="2"/>
    <text x="216" y="242" fill="#075985">CTG</text>

    <!-- Rajshahi Pin -->
    <circle cx="54" cy="108" r="3.5" fill="#ffffff" stroke="#F59E0B" stroke-width="1.8"/>
    <text x="54" y="122" fill="#78350f">RAJ</text>

    <!-- Khulna Pin -->
    <circle cx="74" cy="218" r="3.5" fill="#ffffff" stroke="#EF4444" stroke-width="1.8"/>
    <text x="74" y="232" fill="#7f1d1d">KHL</text>

    <!-- Sylhet Pin -->
    <circle cx="210" cy="82" r="3.5" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
    <text x="210" y="96" fill="#1e293b">SYL</text>
